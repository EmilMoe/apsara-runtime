name: MariaDB

# MariaDB for macOS, built from MariaDB's official source releases (there is no official macOS
# build), so Apsara doesn't have to compile it on the user's Mac. Windows uses MariaDB's own
# winx64 zip directly.
#
# Copy this file to .github/workflows/mariadb.yml in EmilMoe/apsara-runtime and run it.
# Each version gets a release mariadb-<version> with one archive per platform (bin/, share/,
# scripts/ ... at the top level), and mariadb.json lists the newest build per series.
on:
  workflow_dispatch:
    inputs:
      series:
        description: MariaDB series as a JSON list
        required: true
        default: '["10.11", "11.8"]'

permissions:
  contents: read

jobs:
  build:
    name: MariaDB ${{ matrix.series }} (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        series: ${{ fromJSON(inputs.series) }}
        target: [macos-aarch64, macos-x86_64]
        include:
          - target: macos-aarch64
            runner: macos-15
          - target: macos-x86_64
            runner: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - name: Find the newest release
        run: |
          version=$(curl -fsSL "https://downloads.mariadb.org/rest-api/mariadb/${{ matrix.series }}/latest/" \
            | jq -r '.releases | keys[0]')
          [ -n "$version" ] && [ "$version" != null ] || { echo "::error::No MariaDB ${{ matrix.series }} release"; exit 1; }
          echo "Building MariaDB $version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Tools
        run: brew install cmake ninja openssl@3 bison pkgconf

      - name: Build
        run: |
          curl -fsSL "https://archive.mariadb.org/mariadb-$VERSION/source/mariadb-$VERSION.tar.gz" | tar -xz
          cmake -S "mariadb-$VERSION" -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/install" \
            -DBISON_EXECUTABLE="$(brew --prefix bison)/bin/bison" \
            -DWITH_SSL=system -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" -DOPENSSL_USE_STATIC_LIBS=ON \
            -DWITH_ZLIB=bundled -DWITH_PCRE=bundled \
            -DWITH_UNIT_TESTS=OFF -DWITH_EMBEDDED_SERVER=OFF -DWITH_WSREP=OFF -DENABLED_LOCAL_INFILE=ON \
            -DPLUGIN_ROCKSDB=NO -DPLUGIN_MROONGA=NO -DPLUGIN_SPIDER=NO -DPLUGIN_CONNECT=NO \
            -DPLUGIN_COLUMNSTORE=NO -DPLUGIN_S3=NO -DPLUGIN_OQGRAPH=NO -DPLUGIN_TOKUDB=NO \
            -DPLUGIN_AUTH_GSSAPI=NO -DPLUGIN_AUTH_GSSAPI_CLIENT=OFF -DPLUGIN_PERFSCHEMA=STATIC
          cmake --build build -j "$(sysctl -n hw.ncpu)"
          cmake --install build
          rm -rf install/mysql-test install/sql-bench install/include install/lib/pkgconfig

      - name: Smoke test
        run: |
          bin=install/bin
          "$bin/mariadbd" --version
          # Only system libraries, so it runs on any Mac.
          for f in mariadbd mariadb mariadb-dump; do
            if otool -L "$bin/$f" | tail -n +2 | grep -vE "^\s+/(usr/lib|System/Library)/"; then
              echo "::error::$f links to non-system libraries"; exit 1
            fi
          done
          data=$(mktemp -d)
          "$bin/mariadb-install-db" --no-defaults --basedir="$PWD/install" --datadir="$data/d" \
            --auth-root-authentication-method=normal --skip-test-db
          "$bin/mariadbd" --no-defaults --basedir="$PWD/install" --datadir="$data/d" --port=3399 \
            --bind-address=127.0.0.1 --socket="$data/s.sock" &
          pid=$!
          for _ in $(seq 60); do "$bin/mariadb" --no-defaults -uroot -h127.0.0.1 -P3399 -e 'select 1' && break; sleep 1; done
          "$bin/mariadb" --no-defaults -uroot -h127.0.0.1 -P3399 -e 'create database t; select version()'
          kill $pid; wait $pid || true

      - name: Package
        run: |
          mkdir -p dist
          name="mariadb-$VERSION-${{ matrix.target }}.tar.gz"
          tar -czf "dist/$name" -C install .
          (cd dist && shasum -a 256 "$name" | awk '{print $1}' > "$name.sha256")
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: mariadb-${{ matrix.series }}-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ !cancelled() }}
    needs: build
    runs-on: ubuntu-latest
    concurrency: mariadb-publish
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: mariadb-*
          path: dist
          merge-multiple: true

      - name: Releases and mariadb.json
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          path=mariadb.json
          existing=$(gh api "repos/$REPO/contents/$path" --jq .content 2>/dev/null | base64 -d 2>/dev/null || echo '{}')
          manifest=${existing:-'{}'}

          for version in $(ls dist | sed -nE 's/^mariadb-([0-9]+\.[0-9]+\.[0-9]+)-.*\.tar\.gz$/\1/p' | sort -u); do
            tag="mariadb-$version"
            files=(dist/mariadb-$version-*.tar.gz)
            if gh release view "$tag" --repo "$REPO" > /dev/null 2>&1; then
              gh release upload "$tag" "${files[@]}" --repo "$REPO" --clobber
            else
              gh release create "$tag" "${files[@]}" --repo "$REPO" --target main --latest=false \
                --title "MariaDB $version" \
                --notes "MariaDB $version for macOS, built from https://archive.mariadb.org/mariadb-$version/source/ (macOS 13+)."
            fi

            series=$(cut -d. -f1,2 <<< "$version")
            for file in "${files[@]}"; do
              name=$(basename "$file")
              target=$(sed -E 's/^mariadb-[0-9.]+-(.*)\.tar\.gz$/\1/' <<< "$name")
              manifest=$(jq --arg series "$series" --arg version "$version" --arg target "$target" \
                --arg url "https://github.com/$REPO/releases/download/$tag/$name" \
                --arg sha "$(cat "$file.sha256")" \
                '.[$series] |= (if (.version // "0") != $version then {version: $version, files: {}} else . end)
                 | .[$series].files[$target] = {url: $url, sha256: $sha}' <<< "$manifest")
            done
          done

          echo "$manifest" | jq -S . > mariadb.json
          cat mariadb.json
          sha=$(gh api "repos/$REPO/contents/$path" --jq .sha 2>/dev/null || true)
          gh api -X PUT "repos/$REPO/contents/$path" \
            -f message="MariaDB builds" \
            -f content="$(base64 -w0 mariadb.json)" \
            ${sha:+-f sha="$sha"} > /dev/null
